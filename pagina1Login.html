<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link href="./css/estilo1Login.css" rel="stylesheet">
    <link rel="shortcut icon" href="./Assets/img/icon2.png" type="image/x-icon">
</head>
<body>
    <!-- PARTE PRINCIPAL DO LOGIN -->
    <main>
        <div class="container">
            <div class="row">
                <div class="col">
                    <form id="login-form">
                        <img src="./Assets/img/logo1.png" alt="image logo">          
                        <h1 class="h3 mb-3 fw-normal">Faça login</h1>
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email-input" placeholder="name@example.com"/>
                            <label for="floatingInput">Email</label>
                        </div>
                        <div class="form-floating">
                            <input type="password" class="form-control" id="password-input" placeholder="Password"/>
                            <label for="floatingPassword">Senha</label>
                        </div>
                        <div class="form-check text-start my-3">
                            <input class="form-check-input" type="checkbox" value="remember-me" id="session-check"/>
                            <label class="form-check-label" for="checkDefault">Lembrar-me depois</label>
                        </div>
                        
                        <!-- BOTÃO: Dessa forma tem que clicar na palavra para funcionar, mas é só pra facilitar sua navegação entre as páginas-->
                        <button id="button-login" class="w-100 py-2" type="submit"><a href="pagina3Inicial.html" class="botao-link text-light" target="_blank">Entrar</a></button>
                        <p class="link">Primeira vez aqui? <a href="pagina2Cadastro.html">Criar conta.</a></p>
                    </form>
                </div>
            </div>
        </div>
        <p class="paragrafo text-center text-body-secondary">&copy;2025 equipe de agendamentos CEP</p>
    </main>
    <script src="./js/pagina1Login.js"></script>
</body>
</html>
